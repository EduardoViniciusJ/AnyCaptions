[package]
name = "anycaptions"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "anycaptions_lib"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", default-features = false, features = ["wry", "compression", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-global-shortcut = "2.4.1"
serde_json = "1"
wasapi = "0.26.0"
rubato = "5.0.1"
audioadapter-buffers = "5.2.0"
sha2 = "0.11.1"
# Streams catalog model downloads on a worker thread; blocking and small
# (no async runtime), with rustls built in.
ureq = "3.4"
# Loads the NeMo-Speech C library at runtime, so the app still builds and starts without it.
libloading = "0.8.9"
# Detects the caption language locally when the recognizer does not tag it.
whatlang = "0.18.0"
# Pastes dictated text into the focused app (clipboard + synthetic Ctrl+V).
# Already in the tree via wasapi, so this adds no new transitive code.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
mockall = "0.15.0"
hound = "3.5.1"
tauri = { version = "2.12.4", default-features = false, features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Hashing the ~740 MB model on every debug start is slow without optimization.
[profile.dev.package.sha2]
opt-level = 3
