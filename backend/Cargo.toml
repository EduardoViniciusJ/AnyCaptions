[package]
name = "anycaptions"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "anycaptions_lib"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", default-features = false, features = ["wry", "compression"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "2.12.4", default-features = false, features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
